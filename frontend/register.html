<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Organic Species</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-success">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html"
            >
                🌿 Organic Species
            </a>


            <a
                href="index.html"
                class="btn btn-light"
            >
                ← Back to Home
            </a>

        </div>

    </nav>



    <!-- REGISTER SECTION -->

    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="card shadow border-0">

                        <div class="card-body p-4">


                            <h2 class="text-center mb-4">
                                Create Account
                            </h2>



                            <form id="register-form">


                                <!-- Full Name -->

                                <div class="mb-3">

                                    <label
                                        for="register-name"
                                        class="form-label"
                                    >
                                        Full Name
                                    </label>

                                    <input
                                        type="text"
                                        id="register-name"
                                        class="form-control"
                                        placeholder="Enter your full name"
                                        required
                                    >

                                </div>



                                <!-- Username -->

                                <div class="mb-3">

                                    <label
                                        for="register-username"
                                        class="form-label"
                                    >
                                        Username
                                    </label>

                                    <input
                                        type="text"
                                        id="register-username"
                                        class="form-control"
                                        placeholder="Enter username"
                                        required
                                    >

                                </div>



                                <!-- Email -->

                                <div class="mb-3">

                                    <label
                                        for="register-email"
                                        class="form-label"
                                    >
                                        Email
                                    </label>

                                    <input
                                        type="email"
                                        id="register-email"
                                        class="form-control"
                                        placeholder="Enter your email"
                                        required
                                    >

                                </div>



                                <!-- Password -->

                                <div class="mb-3">

                                    <label
                                        for="register-password"
                                        class="form-label"
                                    >
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        id="register-password"
                                        class="form-control"
                                        placeholder="Create a password"
                                        required
                                    >

                                </div>



                                <!-- Confirm Password -->

                                <div class="mb-3">

                                    <label
                                        for="confirm-password"
                                        class="form-label"
                                    >
                                        Confirm Password
                                    </label>

                                    <input
                                        type="password"
                                        id="confirm-password"
                                        class="form-control"
                                        placeholder="Confirm your password"
                                        required
                                    >

                                </div>



                                <!-- Register Button -->

                                <button
                                    type="submit"
                                    class="btn btn-success w-100"
                                >
                                    Create Account
                                </button>


                            </form>



                            <p class="text-center mt-4 mb-0">

                                Already have an account?

                                <a
                                    href="login.html"
                                    class="text-success fw-bold"
                                >
                                    Sign In
                                </a>

                            </p>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Organic Species. All Rights Reserved.
        </p>

    </footer>

    <script src="js/register.js"></script>
</body>

</html>
