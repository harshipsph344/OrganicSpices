<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | Organic Species</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<!-- ============================= -->
<!-- NAVBAR -->
<!-- ============================= -->

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html"
        >
            🌿 Organic Species
        </a>

        <a
            href="index.html"
            class="btn btn-light"
        >
            ← Back to Home
        </a>

    </div>

</nav>


<!-- ============================= -->
<!-- PROFILE -->
<!-- ============================= -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            👤 My Profile
                        </h2>


                        <!-- Username -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Username
                            </label>

                            <input
                                type="text"
                                id="profile-username"
                                class="form-control"
                                readonly
                            >

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Email
                            </label>

                            <input
                                type="email"
                                id="profile-email"
                                class="form-control"
                                readonly
                            >

                        </div>


                        <!-- Phone -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Phone
                            </label>

                            <input
                                type="text"
                                id="profile-phone"
                                class="form-control"
                                placeholder="Enter your phone number"
                            >

                        </div>


                        <!-- Address -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Address
                            </label>

                            <textarea
                                id="profile-address"
                                class="form-control"
                                rows="3"
                                placeholder="Enter your address"
                            ></textarea>

                        </div>


                        <!-- Save Button -->

                        <div class="text-center mt-4">

                            <button
                                type="button"
                                class="btn btn-success"
                                onclick="updateProfile()"
                            >
                                💾 Save Changes
                            </button>

                        </div>


                        <!-- Profile Message -->

                        <div
                            id="profile-message"
                            class="text-center mt-3"
                        ></div>


                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- ============================= -->
<!-- FOOTER -->
<!-- ============================= -->

<footer>

    <p>
        © 2026 Organic Species. All Rights Reserved.
    </p>

</footer>


<script src="js/profile.js"></script>

</body>

</html>
