<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Organic Species</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-success">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html"
            >
                🌿 Organic Species
            </a>


            <a
                href="index.html"
                class="btn btn-light"
            >
                ← Back to Home
            </a>

        </div>

    </nav>



    <!-- LOGIN SECTION -->

    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="card shadow border-0">

                        <div class="card-body p-4">


                            <h2 class="text-center mb-4">
                                Sign In
                            </h2>


                            <form id="login-form">


                                <!-- Username -->

                                <div class="mb-3">

                                    <label
                                        for="login-username"
                                        class="form-label"
                                    >
                                        Username
                                    </label>

                                    <input
                                        type="text"
                                        id="login-username"
                                        class="form-control"
                                        placeholder="Enter your username"
                                        required
                                    >

                                </div>



                                <!-- Password -->

                                <div class="mb-3">

                                    <label
                                        for="login-password"
                                        class="form-label"
                                    >
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        id="login-password"
                                        class="form-control"
                                        placeholder="Enter your password"
                                        required
                                    >

                                </div>



                                <!-- Login Button -->

                                <button
                                    type="submit"
                                    class="btn btn-success w-100"
                                >
                                    Sign In
                                </button>


                            </form>



                            <p class="text-center mt-4 mb-0">

                                Don't have an account?

                                <a
                                    href="register.html"
                                    class="text-success fw-bold"
                                >
                                    Create Account
                                </a>

                            </p>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Organic Species. All Rights Reserved.
        </p>

    </footer>



    <!-- Login JavaScript -->

    <script src="js/login.js"></script>


</body>

</html>
